[project]
name = "PyOTP"
description = "Python One Time Password Library"
readme = "README.rst"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrey Kislyuk"}, {email = "kislyuk@gmail.com" }]
maintainers = [{ name = "Andrey Kislyuk"}, {email = "kislyuk@gmail.com" }]
dynamic = ["version"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Development Status :: 5 - Production/Stable",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["coverage", "wheel", "ruff", "mypy"]

[project.urls]
"Homepage"= "https://github.com/pyauth/pyotp"
"Documentation"= "https://github.com/pyauth/pyotp"
"Source Code"= "https://github.com/pyauth/pyotp"
"Issue Tracker"= "https://github.com/pyauth/pyotp/issues"
"Change Log"= "https://github.com/pyauth/pyotp/blob/main/Changes.rst"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "SIM102",  # Allow nested if statements.
    "SIM117",  # Allow nested with statements.
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Keep accepted timestamp types explicit in public API annotations.
"src/pyotp/totp.py" = ["PYI041"]
